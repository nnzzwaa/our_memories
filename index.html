<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:#111; color:#fff; font-family:Arial,sans-serif;
}
.container{width:min(92%,700px);text-align:center;padding:24px}
h1{font-size:26px;margin-bottom:10px}
p{opacity:.75;margin-bottom:28px}
button{
  background:#fff;color:#111;border:0;border-radius:999px;padding:15px 28px;
  font-size:16px;font-weight:bold;cursor:pointer;
}
video{width:100%;border-radius:16px;margin-top:22px;display:none}
.note{font-size:12px;opacity:.5;margin-top:18px}
</style>
</head>
<body>
<div class="container">
  <h1>🎁 A Little Surprise For You</h1>
  <p>Scan it. Open it. Keep the memory. ♡</p>
  <button id="openBtn" onclick="openVideo()">▶ BUKA VIDEO</button>
  <video id="video" controls playsinline>
    <source src="video.mp4" type="video/mp4">
    Browser kamu tidak mendukung video.
  </video>
  <div class="note">Turn up your volume 🔊</div>
</div>
<script>
function openVideo(){
  const v=document.getElementById('video');
  document.getElementById('openBtn').style.display='none';
  v.style.display='block';
  v.muted=false;
  v.play().catch(()=>{ v.controls=true; });
}
</script>
</body>
</html>
